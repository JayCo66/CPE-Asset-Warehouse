server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # API ของ dashboard อยู่ที่ warehouse-api (PHP)
    # resolve ชื่อผ่าน DNS ของ Docker ทุกครั้ง: ถ้า warehouse-api ถูกสร้างใหม่ (IP เปลี่ยน) ไม่ต้องรีสตาร์ท nginx
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $backend http://warehouse-api;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }
}
