# ไม่แสดงรายชื่อไฟล์ในโฟลเดอร์ และไม่บอกเวอร์ชัน Apache/PHP
<Directory /var/www/html>
    Options -Indexes
</Directory>
ServerTokens Prod
ServerSignature Off

# โค้ดภายในและไฟล์ประกอบ ไม่เปิดให้เรียกผ่านเว็บ
<DirectoryMatch "^/var/www/html/(lib|vendor|mock_api)(/|$)">
    Require all denied
</DirectoryMatch>

# บีบอัด JSON ของ API (ค่าเริ่มต้นของ Apache ไม่รวม JSON)
AddOutputFilterByType DEFLATE application/json

# BASE_PATH: entrypoint สร้างไฟล์นี้ตามค่าใน env
IncludeOptional /etc/apache2/cpe-base-path.conf
