<section class="analysis-grid" aria-label="การวิเคราะห์วงจรชีวิตสินทรัพย์">
  <article class="panel age-panel">
    <div class="panel-heading">
      <h2>การกระจายอายุสินทรัพย์</h2>
      <span class="panel-aside" id="age-unknown-count">อายุที่ไม่ทราบ — รายการ</span>
    </div>
    <div class="age-chart" id="age-chart" hidden></div>
    <div class="empty-state" id="age-data-empty" role="status" aria-live="polite">
      <strong>ยังไม่มีข้อมูลอายุสินทรัพย์</strong>
      <p>กราฟจะแสดงเมื่อคลังส่งข้อมูลอายุจากชุดข้อมูลล่าสุด</p>
    </div>
  </article>

  <article class="panel location-panel">
    <div class="panel-heading">
      <h2>ความครอบคลุมของตำแหน่ง</h2>
    </div>
    <div class="location-score">
      <strong class="location-percent" id="location-summary-percent">—</strong>
      <div>
        <strong id="location-summary-count">ยังไม่มีข้อมูล</strong>
        <p id="location-summary-detail">รอข้อมูลสรุปจากคลังสินทรัพย์</p>
      </div>
    </div>
    <div
      class="location-meter"
      id="location-summary-meter"
      role="progressbar"
      aria-label="ความครอบคลุมของตำแหน่ง"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
      hidden
    >
      <span></span>
    </div>
  </article>
</section>
