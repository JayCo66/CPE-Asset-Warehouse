<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="แดชบอร์ดทะเบียนและวงจรชีวิตสินทรัพย์ของคลังสินทรัพย์ CPE"
    />
    <title>คลังสินทรัพย์ CPE</title>
    <script>
      (() => {
        if (window.location.protocol !== "file:") return;

        const serverUrl = new URL("http://localhost/CPE-Asset-Warehouse/src/asset-inv/index.html");
        serverUrl.search = window.location.search;
        serverUrl.hash = window.location.hash || "#/inventory/overview";
        window.location.replace(serverUrl.href);
      })();
    </script>
    <script>
      (() => {
        const systemTheme =
          typeof window.matchMedia === "function" && window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        let theme = systemTheme;
        try {
          const savedTheme = window.localStorage.getItem("cpe-asset-inventory-theme");
          if (savedTheme === "light" || savedTheme === "dark") theme = savedTheme;
        } catch {
          // Keep the device theme if browser storage is unavailable.
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="styles.css?v=20261025.8" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">ข้ามไปยังแดชบอร์ด</a>

    <div class="app-shell">
      <header class="app-header">
        <a class="brand" href="#main-content" aria-label="หน้าแรกคลังสินทรัพย์ CPE">
          <span class="brand-mark" aria-hidden="true">CPE</span>
          <span class="brand-copy">
            <span class="brand-kicker">งานปฏิบัติการวิศวกรรม</span>
            <strong>คลังสินทรัพย์</strong>
          </span>
        </a>
        <button
          class="theme-toggle"
          id="theme-toggle"
          type="button"
          aria-label="สลับระหว่างโหมดสว่างและโหมดมืด"
          title="สลับระหว่างโหมดสว่างและโหมดมืด"
        >
          <svg class="theme-toggle-icon theme-toggle-icon-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8" />
            <path d="M12 2.5v2m0 15v2m9.5-9.5h-2m-15 0h-2m16.22-6.72-1.42 1.42M6.7 17.3l-1.42 1.42m13.44 0-1.42-1.42M6.7 6.7 5.28 5.28" stroke="currentColor" stroke-linecap="round" stroke-width="1.8" />
          </svg>
          <svg class="theme-toggle-icon theme-toggle-icon-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" />
          </svg>
          <span class="theme-toggle-label theme-toggle-label-light">สว่าง</span>
          <span class="theme-toggle-label theme-toggle-label-dark">มืด</span>
        </button>
      </header>

      <nav class="module-nav" aria-label="โมดูลพื้นที่ทำงาน">
        <div class="module-links" id="module-links"></div>
      </nav>

      <main class="dashboard" id="main-content" tabindex="-1">
        <div id="dashboard-sections" class="dashboard-sections" aria-busy="true">
          <div class="api-state api-state-loading" role="status" aria-live="polite">
            กำลังโหลดแดชบอร์ด…
          </div>
        </div>
        <div id="asset-detail-container" aria-busy="true" hidden></div>
        <section class="panel module-placeholder-panel" id="module-placeholder" aria-labelledby="module-placeholder-title" hidden>
          <div>
            <p class="panel-kicker">โมดูลหลัก · อยู่ระหว่างเตรียมระบบ</p>
            <h1 id="module-placeholder-title" tabindex="-1"></h1>
            <p class="panel-description" id="module-placeholder-description"></p>
          </div>
        </section>
      </main>

      <footer class="app-footer">
        <span>สมาชิก 1 · ทะเบียนสินทรัพย์และวงจรชีวิต</span>
        <span>โครงสร้างข้อมูล · <code>fact_asset_inventory</code></span>
      </footer>
    </div>

    <button class="back-to-top" id="back-to-top" type="button" aria-label="กลับไปด้านบน" hidden>
      <span class="back-to-top-icon" aria-hidden="true">↑</span>
      <span>กลับไปด้านบน</span>
    </button>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <noscript>
      <div class="no-script-message">แดชบอร์ดนี้ต้องเปิดใช้งาน JavaScript เพื่อแสดงกราฟและตัวกรอง</div>
    </noscript>
    <script type="module" src="app.js?v=20261025.12"></script>
  </body>
</html>
